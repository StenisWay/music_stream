# Copy to config.yaml and adjust. Relative paths are resolved against this file.
server:
  listen: ":8443"        # local address to bind; reach it from outside through the VPN (no port forwarding)
  tls: self-signed       # self-signed (recommended) | files | off
  # certFile: ./tls/fullchain.pem
  # keyFile: ./tls/privkey.pem

library:
  root: ../music_data/library   # organised by `musicorg`
  watch: true                    # inotify: new files appear within seconds
  rescanInterval: 6h             # safety net in case events were missed
  inbox: ../music_data/inbox     # drop new music here; it is classified into library/ automatically
  ingestMinAge: 10s              # wait until a file stopped changing (copy/download finished)

dataDir: ./data                  # SQLite DB, TLS key, secrets

auth:
  username: admin
  # Generate with: go run ./cmd/musicserver hash-password
  # or set env MUSICSTREAM_PASSWORD_HASH
  passwordHash: ""
  accessTTL: 1h
  refreshTTL: 2160h              # 90 days

transcode:
  ffmpeg: ffmpeg                 # enables WMA -> MP3 streaming when installed

discover:
  ytdlp: yt-dlp                  # search/download songs from YouTube & SoundCloud into the inbox (needs ffmpeg + inbox)

log:
  level: info
  format: text
